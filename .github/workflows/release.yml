name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      # No registry-url: it writes an _authToken placeholder to .npmrc, which
      # makes npm skip the OIDC exchange and fail with E404.
      # No dependency cache in release builds.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check OIDC token is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token available. The job needs 'id-token: write' for npm trusted publishing."
            exit 1
          fi

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs the build. Pre-release versions (e.g. 1.1.0-beta.1)
      # go to the "next" dist-tag so they never become "latest".
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist when it was created from the GitHub UI.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          FLAGS=(--generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}"
