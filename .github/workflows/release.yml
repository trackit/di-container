name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5.1, required for trusted publishing.
      # No dependency cache in release builds.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs the build. Pre-release versions (e.g. 1.1.0-beta.1)
      # go to the "next" dist-tag so they never become "latest".
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=(--generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${FLAGS[@]}"
